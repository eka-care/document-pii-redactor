[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eka-pii-redaction"
version = "0.2.3"
description = "Detect, redact, de-identify, or anonymize PII in document images and plain text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "eka-care" }]
keywords = ["pii", "redaction", "ocr", "document-ai"]

dependencies = [
    "torch>=2.1",
    # The published weights are serialized with transformers 5.x (nested
    # processor_config.json + new tokenizer.json format). transformers 4.x
    # cannot load them, so require 5.x. (5.x needs Python >=3.10, matching
    # requires-python above.) Also needs a recent torch (see Dockerfile base
    # image comment) — transformers 5.x imports torch APIs (DTensor,
    # float8_e8m0fnu) that don't exist in older torch releases.
    "transformers>=5.0",
    "huggingface_hub>=0.23",
    # XLM-R tokenizer backing the text MiniLM model (fast path loads from
    # tokenizer.json, but the slow-tokenizer fallback needs sentencepiece).
    "sentencepiece>=0.1.99",
    "pillow>=9.0",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
    "ultralytics>=8.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/eka-care/Eka-PII-redactors"

[tool.setuptools.packages.find]
include = ["eka_pii_redaction*"]
